services:
  chromadb:
    image: chromadb/chroma:1.5.10.dev304
    volumes:
      - chromadb-data:/chroma/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    depends_on:
      - chromadb
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-campusclaw-change-this-in-production-please}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin123}
      SQLITE_PATH: /app/data/campusclaw.db
      STORAGE_ROOT: /app/data
      CHROMA_URL: http://chromadb:8000
      PORT: 3000
    volumes:
      - campusclaw-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp-server
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      PORT: 8090
    restart: unless-stopped

volumes:
  campusclaw-data:
  chromadb-data: